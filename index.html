<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dugout Diary – A free career diary for young ballplayers</title>
  <meta name="description" content="Log games, track batting, pitching and fielding stats, set goals and earn badges. Free, private, and no birthdays or emails collected.">
  <meta name="theme-color" content="#0F1F0F">
  <meta property="og:title" content="Dugout Diary - a free career diary for young ballplayers">
  <meta property="og:description" content="Log games, track your stats, earn badges, and share your player card. Free, private, no sign-up.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dugout Diary">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="top" id="top">
    <div class="top-row">
      <div class="brand">
        <h1>Dugout Diary</h1>
        <p class="tag">Your baseball story, one game at a time</p>
      </div>
      <button class="who" id="who" data-action="open-players" hidden></button>
    </div>
    <div class="progress" id="progress" hidden>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Badges earned"><span id="bar-fill"></span></div>
      <p id="bar-text">0 of 14 badges</p>
    </div>
  </header>

  <div id="banner"></div>
  <main id="main" tabindex="-1"></main>

  <nav class="tabs" aria-label="Main">
    <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="#log" data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Log</span></a>
    <a href="#career" data-tab="career"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Career</span></a>
    <a href="#goals" data-tab="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg><span>Goals</span></a>
    <a href="#about" data-tab="about"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span>About</span></a>
  </nav>

  <div id="modal-root"></div>

  <noscript><p style="padding:24px;color:#f4f1e8">Dugout Diary needs JavaScript to run. Nothing is sent anywhere – your stats stay in your browser.</p></noscript>

  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
